<!doctype html><html><meta charset="utf-8"><style>body{margin:0;background:#15151a;overflow:hidden}label{position:absolute;color:#fff;font:bold 12px monospace;text-shadow:0 0 4px #000;background:#0009;padding:3px;pointer-events:none}</style><canvas></canvas><script type="module">import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});r.setSize(innerWidth,innerHeight);const scene=new T.Scene();scene.background=new T.Color('#161821');scene.add(new T.HemisphereLight(0xffffff,0x555555,3));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(10,30,10);scene.add(sun);const {scene:map}=await new GLTFLoader().loadAsync('/maps/haven-c/model.glb');scene.add(map);map.updateMatrixWorld(true);const hide=[];map.traverse(n=>{if(!n.isMesh)return;const b=new T.Box3().setFromObject(n);if(b.max.y>4 || b.min.y< -3 || b.getSize(new T.Vector3()).length()>80)hide.push(n);});hide.forEach(n=>n.visible=false);const camera=new T.OrthographicCamera(-32*innerWidth/innerHeight,32*innerWidth/innerHeight,32,-32,.1,100);camera.position.set(0,60,0);camera.up.set(0,0,-1);camera.lookAt(0,0,0);camera.updateMatrixWorld();for(let x=-20;x<=20;x+=5)for(let z=-20;z<=20;z+=5){const p=new T.Vector3(x,.05,z).project(camera);const label=document.createElement('label');label.textContent=x+','+z;label.style.left=((p.x+1)/2*innerWidth)+'px';label.style.top=((-p.y+1)/2*innerHeight)+'px';document.body.append(label);}r.render(scene,camera);</script></html>
