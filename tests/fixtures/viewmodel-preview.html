<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Viewmodel</title><style>html,body{margin:0;background:#111}#w{width:100vw;height:100vh}canvas{width:100%;height:100%;display:block}</style></head>
<body><div id="w"><canvas id="c"></canvas></div><script type="module">
// First-person view exactly as in the arena: ?weapon=vandal&arms=fpshands&side=right
import { ArenaRenderer } from '/src/renderer/ArenaRenderer.js';
const q = new URLSearchParams(location.search);
const r = new ArenaRenderer(document.getElementById('c'));
r.agentId = q.get('arms') || 'fpshands';
r.setWeaponSide(q.get('side') || 'right');
const weaponId = q.get('weapon') || 'vandal';
await r.equip(weaponId);
const session = { mode: 1, course: null, targets: [], events: [], position: { x: 0, y: 1.65, z: 2 }, pitch: 0, yaw: 0, ads: false, reloadLeft: 0, weapon: { reload: 1 }, recoil: 0, flash: 0, bob: 0, moveSpeed: 0, weaponId };
r.render(session, 0.016);
window.info = { ok: true };
window.done = true;
</script></body></html>
