<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Agentes enemigos — vista previa</title>
    <style>
      html,body{margin:0;background:#111}
      #wrap{width:100vw;height:100vh}
      canvas{display:block;width:100%;height:100%}
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="c"></canvas></div>
    <script type="module">
      // Renders the arena once with full-body agent bots.
      // ?color=rojo|amarillo|morado  &near=1 for a close-up  &mode=3
      import { ArenaRenderer } from '/src/renderer/ArenaRenderer.js';
      const q = new URLSearchParams(location.search);
      const mode = Number(q.get('mode') || 3);
      const r = new ArenaRenderer(document.getElementById('c'));
      r.setEnemyOutline(q.get('color') || 'rojo');
      const near = q.get('near') === '1';
      const targets = near
        ? [
            { id: 0, x: -0.9, y: 1.65, z: -4 },
            { id: 1, x: 0.9, y: 1.65, z: -5, yaw: 0.6 },
          ]
        : [-8, -2.7, 2.7, 8].map((x, id) => ({ id, x, y: 1.65, z: -18 + id }));
      const session = {
        mode, course: null, targets, events: [],
        position: { x: 0, y: 1.65, z: 2 }, pitch: near ? -0.05 : 0, yaw: 0,
        ads: false, reloadLeft: 0, weapon: { reload: 1 }, recoil: 0, flash: 0,
        bob: 0, moveSpeed: 0, weaponId: 'vandal',
      };
      const wait = (ms) => new Promise((ok) => setTimeout(ok, ms));
      for (let i = 0; i < 300 && !(r.agentTemplates.enemy && r.agentTemplates.ally && r.agentTemplates.vandal); i++) await wait(100);

      console.log('templates', !!r.agentTemplates.enemy, !!r.agentTemplates.ally);
      const t0 = performance.now();
      r.render(session, 0.016);
      console.log('render ms', Math.round(performance.now() - t0));
      window.info = {
        bots: r.bots.children.length,
        hitCenter: r.cast({ x: 0, y: 0 }),
        aim: Object.fromEntries(
          [['head', 1.68], ['chest', 1.25], ['legs', 0.5, 0.11], ['legs2', 0.5, -0.11], ['overHead', 1.95]].map(([name, y, dx = 0]) => {
            const t = targets[0];
            r.camera.updateMatrixWorld(true);
            const p = new r.camera.position.constructor(t.x + dx, t.y - 1.65 + y, t.z).project(r.camera);
            return [name, r.cast({ x: p.x, y: p.y })];
          }),
        ),
      };
      window.done = true;
    </script>
  </body>
</html>
