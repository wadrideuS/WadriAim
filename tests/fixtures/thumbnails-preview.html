<!doctype html><html lang="es"><meta charset="utf-8"><title>Miniaturas de modos</title><link rel="stylesheet" href="/src/styles/app.css"><style>body{padding:32px;background:#09090d;--palette-accent:#f04b88}main{max-width:1150px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{width:100%;text-align:left}.info{color:#ddd}h1{max-width:1150px;margin:0 auto 24px;font-size:26px}</style><h1>Entrena a tu manera</h1><main></main><script type="module">import {modeThumbnail} from '/src/features/mode-thumbnails.js';import {exercises} from '/src/data/exercises.js';document.querySelector('main').innerHTML=exercises.map((e,i)=>`<article class="card"><div class="thumb mode-thumb"><span class="tag">${e[1]}</span>${modeThumbnail(i)}</div><div class="info"><h3>${e[0]}</h3><p>${e[2]}</p></div></article>`).join('');</script></html>
